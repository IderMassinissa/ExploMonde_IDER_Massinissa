<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <title>ExploMonde – Recherche de pays</title>
  </head>
  <body>
    <a href="#main-content">Aller au contenu principal</a>

    <header>
      <h1>ExploMonde</h1>
      <nav>
        <ul>
          <li><a href="#recherche">Recherche</a></li>
          <li><a href="#resultats">Résultats</a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <section id="recherche">
        <h2>Rechercher un pays</h2>
        <form>
          <label for="pays">Nom du pays</label>
          <input type="text" id="pays" name="pays" />
          <button type="submit">Rechercher</button>
        </form>
      </section>

      <section id="resultats">
        <h2>Résultats</h2>
        <p id="statut-resultats" role="status">8 pays trouvés</p>

        <label for="filtre-region">Filtrer par région</label>
        <select id="filtre-region">
          <option value="toutes">Toutes les régions</option>
          <option value="Europe">Europe</option>
          <option value="Asie">Asie</option>
          <option value="Amériques">Amériques</option>
          <option value="Afrique">Afrique</option>
        </select>

        <div id="resultats-liste"></div>
        <div id="detail" hidden></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 ExploMonde</p>
    </footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
